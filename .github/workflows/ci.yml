name: ci
on:
  pull_request:
  push:
    branches: [ main, work ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: businessos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cross-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-businessos
      - name: Verify cross-platform gate
        shell: pwsh
        run: ./eng/verify-cross-platform.ps1 2>&1 | Tee-Object .cache/verify-cross-platform.log
      - name: Stage evidence
        if: always()
        shell: pwsh
        run: ./eng/stage-ci-artifacts.ps1 -Gate cross-platform
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: businessos-cross-platform-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-evidence/cross-platform/**
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-businessos
      - name: Verify Windows gate
        shell: pwsh
        run: ./eng/verify-windows.ps1 2>&1 | Tee-Object .cache/verify-windows.log
      - name: Stage evidence
        if: always()
        shell: pwsh
        run: ./eng/stage-ci-artifacts.ps1 -Gate windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: businessos-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-evidence/windows/**
          if-no-files-found: error
          retention-days: 14
  required-gates:
    needs:
      - cross-platform
      - windows
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform gate
        shell: pwsh
        env:
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          Write-Host "cross-platform=$env:CROSS_PLATFORM_RESULT"
          Write-Host "windows=$env:WINDOWS_RESULT"
          if ($env:CROSS_PLATFORM_RESULT -ne 'success' -or $env:WINDOWS_RESULT -ne 'success') { exit 1 }
